name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix old XIB deployment target
        run: |
          find . -name "*.xib" -exec sed -i '' 's/version="1300"/version="1500"/g' {} +
          find . -name "*.xib" -exec sed -i '' 's/com.apple.InterfaceBuilder3.CocoaTouch.XIB" version="3.0"/com.apple.InterfaceBuilder3.CocoaTouch.XIB" version="3.0" targetRuntime="iOS.CocoaTouch"/g' {} +
          find . -name "*.xib" -exec perl -i -pe 's/<plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="\d+"\/>/<plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21507"\/>/g' {} +
          find . -name "*.xib" -exec perl -i -pe 's/<deployment version="\d+" identifier="iOS"\/>/<deployment version="4608" identifier="iOS"\/>/g' {} +

      - name: Build App
        run: |
          xcodebuild -project Brushes.xcodeproj \
            -scheme Brushes \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            ENABLE_BITCODE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build SYMROOT=$(PWD)/build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Brushes.app Payload/
          zip -r Brushes.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Brushes-IPA
          path: Brushes.ipa
